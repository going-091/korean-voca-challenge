{q:'Translate: “What is your nationality?”',a:'국적이 뭐예요?'},
{q:'Translate: “There is no milk.”',a:'우유가 없어요.'},
{q:'Translate: “The restaurant is next to the bank.”',a:'식당이 은행 옆에 있어요.'}
];
const roundNames=['Vocabulary Quiz','Picture Quiz','Translation','Grammar & Particles','Location Challenge','Sentence Builder','Lucky Number','Bonus Questions'];
let translationDirection='ko-en',translationDraft='',mode='home',kind='meaning',pi=0,selection=null,revealed=false,correct=0,attempt=0,chosen=[],teamRound=0,ti=0,teamAnswer=false,teams=['Team A','Team B','Team C'],scores=[0,0,0],usedLucky=[],seconds=60,timerId=null;
const kinds=[['meaning','Vocabulary quiz'],['picture','Picture quiz'],['grammar','Grammar & particles'],['location','Location sentences'],['sentences','Sentence builder'],['words','Vocabulary cards'],['translation','Translation (Korean ↔ English)']];
function draw(html,keepScroll=false){const oldY=window.scrollY;$('#app').innerHTML=html;document.body.classList.toggle('playing',mode!=='home');document.querySelectorAll('.topnav button').forEach((el,i)=>el.classList.toggle('current',i===(mode==='home'?0:mode==='practice'?1:2)));if(keepScroll)window.scrollTo(0,oldY);else window.scrollTo(0,0)}function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function home(){mode='home';stopTimer();draw(`<div class="tiles"><section class="tile"><div class="symbol">📖</div><h3>Individual Practice</h3><button class="btn" onclick="practice()">Start practice →</button></section><section class="tile"><div class="symbol">🏆</div><h3>Team Challenge</h3><button class="btn dark" onclick="teacher()">Start challenge →</button></section></div>`)}
function practice(k){stopTimer();mode='practice';if(k)kind=k;pi=0;selection=null;revealed=false;translationDraft='';correct=0;attempt=0;chosen=[];renderPractice()}
function pItems(){return kind==='meaning'?meanings:kind==='picture'?pictures:kind==='grammar'?grammar:kind==='location'?locations:kind==='sentences'?sentences:kind==='words'?V:translationPairs}
function options(o,a){return `<div class="answers">${o.map((v,i)=>`<button class="answer ${selection===i?(i===a?'chosen':'wrong'):''}" ${selection!==null?'disabled':''} onclick="choose(${i})">${'ABCD'[i]}. ${safe(v)}</button>`).join('')}</div>${selection!==null?`<div class="feedback ${selection===a?'':'bad'}"><strong>${selection===a?'Correct':'Incorrect'}</strong><div>${safe(o[a])}</div></div>`:''}`}
function renderPractice(keepScroll=false){const data=pItems(),item=data[pi],n=data.length;let body='';
if(kind==='meaning')body=`<div class="question"><div class="ko">${safe(item.q)}</div></div>${options(item.o,item.a)}`;
if(kind==='picture')body=`<div class="question"><div class="picture" role="img" aria-label="Picture vocabulary question">${item.p}</div></div>${options(item.o,item.a)}`;
if(kind==='grammar')body=`<div class="question"><div class="ko">${safe(item.q)}</div></div>${options(item.o,item.a)}`;
if(kind==='location')body=`<div class="question"><div class="ko" style="font-size:clamp(22px,3vw,29px)">${safe(item.q)}</div></div>${options(item.o,item.correct)}`;
if(kind==='sentences'){const permutation=item.parts.map((_,i)=>i).sort((a,b)=>((a*7+3)%11)-((b*7+3)%11));const result=chosen.map(i=>item.parts[i]).join(' ');body=`<div class="question"><div class="ko">Arrange the words</div></div><div class="sentencewords">${permutation.map(i=>`<button class="word" ${chosen.includes(i)?'disabled':''} onclick="addWord(${i})">${safe(item.parts[i])}</button>`).join('')}</div><div class="assembled">${chosen.length?safe(result):' '}</div><div class="controls"><button class="btn secondary small" onclick="chosen=[];revealed=false;renderPractice()">Clear</button><button class="btn small" onclick="checkSentence()" ${chosen.length!==item.parts.length?'disabled':''}>Check</button></div>${revealed?`<div class="feedback ${result===item.full?'':'bad'}"><strong>${result===item.full?'Correct':'Correct sentence'}</strong><div>${safe(item.full)}</div></div>`:''}`}
if(kind==='words')body=`<div class="question"><div class="ko">${safe(item[1])}</div></div><button class="btn" onclick="revealPractice()">Show Korean</button>${revealed?`<div class="reveal"><div class="ko" style="font-size:30px;font-weight:700">${safe(item[0])}</div></div>`:''}`;
if(kind==='translation'){
const koToEn=translationDirection==='ko-en',prompt=koToEn?item[0]:item[1],answer=koToEn?item[1]:item[0];
body=`<div class="translationbar"><button class="btn secondary small" aria-pressed="${koToEn}" onclick="setTranslationDirection('ko-en')">Korean → English</button><button class="btn secondary small" aria-pressed="${!koToEn}" onclick="setTranslationDirection('en-ko')">English → Korean</button></div><div class="question compact"><div class="ko">${safe(prompt)}</div></div><div class="translationentry"><label for="translationInput">Your translation</label><input id="translationInput" class="textanswer" autocomplete="off" placeholder="${koToEn?'Write in English':'한국어로 쓰세요'}" value="${safe(translationDraft)}" oninput="translationDraft=this.value" onkeydown="if(event.key==='Enter')revealPractice()"></div><div class="nearanswer"><button class="btn" onclick="revealPractice()">Check answer</button><button class="btn secondary" onclick="translationDraft='';renderPractice(true)">Clear</button></div>${revealed?`<div class="reveal"><strong>Answer</strong><div style="font-size:21px;margin-top:5px">${safe(answer)}</div></div>`:''}`;
}

draw(`<div class="sectionhead"><h2>Individual Practice</h2><div class="modebuttons"><button class="btn secondary small" onclick="home()">Home</button><button class="btn secondary small" onclick="teacher()">Team Challenge →</button></div></div><div class="panel"><div class="sectionhead"><select class="select" aria-label="Activity" onchange="practice(this.value)">${kinds.map(([k,label])=>`<option value="${k}" ${k===kind?'selected':''}>${label}</option>`).join('')}</select><span class="pill">${pi+1} / ${n}</span></div><div class="progress"><div style="width:${((pi+1)/n)*100}%"></div></div>${body}<div class="controls"><button class="btn secondary" onclick="prevPractice()" ${pi===0?'disabled':''}>Previous</button><span class="stat">${['meaning','picture','grammar','location'].includes(kind)?`${correct} / ${attempt} correct`:''}</span><button class="btn dark" onclick="nextPractice()">${pi===n-1?'Restart':'Next →'}</button></div></div>`,keepScroll)}
function choose(i){if(selection!==null)return;selection=i;attempt++;const item=pItems()[pi],answer=kind==='location'?item.correct:item.a;if(i===answer)correct++;renderPractice()}
function revealPractice(){revealed=true;renderPractice(true)}function setTranslationDirection(d){translationDirection=d;pi=0;translationDraft='';revealed=false;renderPractice()}function addWord(i){if(!chosen.includes(i))chosen.push(i);revealed=false;renderPractice()}function checkSentence(){revealed=true;renderPractice()}function nextPractice(){pi=(pi+1)%pItems().length;selection=null;revealed=false;translationDraft='';chosen=[];if(pi===0){correct=0;attempt=0}renderPractice()}function prevPractice(){pi=Math.max(0,pi-1);selection=null;revealed=false;translationDraft='';chosen=[];renderPractice()}
function teacher(){mode='teacher';stopTimer();teamRound=0;ti=0;teamAnswer=false;renderTeacher()}
function tItems(){switch(teamRound){case 0:return meanings.map(x=>({q:x.q,a:x.o[x.a],options:x.o}));case 1:return pictures.map(x=>({q:x.p,a:x.o[x.a],options:x.o,picture:true}));case 2:return translationPairs.map(x=>({q:translationDirection==='ko-en'?x[0]:x[1],a:translationDirection==='ko-en'?x[1]:x[0]}));case 3:return grammar.map(x=>({q:x.q,a:x.answer,options:x.o}));case 4:return locations.map(x=>({q:x.q,a:x.a,options:x.o}));case 5:return sentences.map(x=>({q:x.parts.slice().reverse().join(' / '),a:x.full}));case 6:return lucky;default:return bonus}}
function renderTeacher(keepScroll=false){const items=tItems(),item=items[ti]||items[0],isLucky=teamRound===6,availableLucky=usedLucky.length>0;
const buttons=`<div class="nearanswer"><button class="btn secondary" onclick="prevTeacher()" ${isLucky||ti===0?'disabled':''}>Previous</button><button class="btn" onclick="revealTeacher()" ${isLucky&&!availableLucky?'disabled':''}>${teamAnswer?'Hide answer':'Show answer'}</button><button class="btn dark" onclick="nextTeacher()" ${isLucky?'disabled':''}>Next →</button></div>`;
draw(`<div class="sectionhead"><h2>Team Challenge</h2><div class="modebuttons"><button class="btn secondary small" onclick="home()">Home</button><button class="btn secondary small" onclick="practice()">← Individual Practice</button></div></div><div class="panel"><div class="roundgrid">${roundNames.map((name,i)=>`<button class="roundcard ${teamRound===i?'active':''}" onclick="chooseRound(${i})"><strong>${i+1}. ${safe(name)}</strong></button>`).join('')}</div><div class="divider" style="margin:16px 0"></div><div class="sectionhead"><div><span class="pill">${safe(roundNames[teamRound])}</span> <span class="stat">${isLucky?usedLucky.length+' / 10':(ti+1)+' / '+items.length}</span></div><div class="controls" style="margin:0"><span class="timer" id="timerDisplay">${clock(seconds)}</span><button class="btn secondary small" id="timerButton" onclick="toggleTimer()">Start</button><button class="btn secondary small" onclick="resetTimer()">Reset</button></div></div>${teamRound===2?`<div class="translationbar"><button class="btn secondary small" aria-pressed="${translationDirection==='ko-en'}" onclick="setTeamTranslationDirection('ko-en')">Korean → English</button><button class="btn secondary small" aria-pressed="${translationDirection==='en-ko'}" onclick="setTeamTranslationDirection('en-ko')">English → Korean</button></div>`:''}${isLucky?`<div class="numgrid">${lucky.map((_,i)=>`<button class="number ${usedLucky.includes(i)?'used':''}" onclick="chooseLucky(${i})" ${usedLucky.includes(i)?'disabled':''}>${i+1}</button>`).join('')}</div>`:''}<div class="question compact">${isLucky&&!availableLucky?'<div class="ko">Choose a number</div>':item.picture?`<div class="picture">${item.q}</div>`:`<div class="ko">${safe(item.q)}</div>`}${item.options&&(!isLucky||availableLucky)?`<div class="answers" style="margin-top:12px">${item.options.map((v,i)=>`<div class="answer">${'ABCD'[i]}. ${safe(v)}</div>`).join('')}</div>`:''}</div>${buttons}${teamAnswer?`<div class="reveal" style="margin-top:8px"><strong>Answer</strong><div style="font-size:21px;line-height:1.5;margin-top:5px">${safe(item.a)}</div></div>`:''}<div class="divider"></div><div class="sectionhead"><h3>Scoreboard</h3><button class="btn secondary small" onclick="resetScores()">Reset scores</button></div><div class="scores">${teams.map((name,i)=>`<div class="score"><input aria-label="Team ${i+1}" value="${safe(name)}" maxlength="24" oninput="teams[${i}]=this.value"><strong>${scores[i]}</strong><div class="scorebuttons"><button class="btn secondary small" onclick="changeScore(${i},-1)">−1</button><button class="btn small" onclick="changeScore(${i},1)">+1</button><button class="btn dark small" onclick="changeScore(${i},3)">+3</button></div></div>`).join('')}</div></div>`,keepScroll)}
function setTeamTranslationDirection(d){translationDirection=d;ti=0;teamAnswer=false;renderTeacher()}
function chooseRound(i){stopTimer();teamRound=i;ti=0;teamAnswer=false;seconds=60;renderTeacher()}function redrawTeacher(){const running=!!timerId;stopTimer();renderTeacher(true);if(running)toggleTimer()}function changeScore(i,d){scores[i]=Math.max(0,scores[i]+d);redrawTeacher()}function resetScores(){if(confirm('Reset team scores?')){scores=[0,0,0];redrawTeacher()}}function revealTeacher(){teamAnswer=!teamAnswer;redrawTeacher()}function nextTeacher(){ti=(ti+1)%tItems().length;teamAnswer=false;redrawTeacher()}function prevTeacher(){ti=Math.max(0,ti-1);teamAnswer=false;redrawTeacher()}function chooseLucky(i){if(usedLucky.includes(i))return;usedLucky.push(i);ti=i;teamAnswer=false;redrawTeacher()}
function clock(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function toggleTimer(){if(timerId){stopTimer();$('#timerButton').textContent='Start';return}if(seconds===0)seconds=60;$('#timerButton').textContent='Pause';timerId=setInterval(()=>{seconds=Math.max(0,seconds-1);if($('#timerDisplay'))$('#timerDisplay').textContent=clock(seconds);if(seconds===0){stopTimer();if($('#timerButton'))$('#timerButton').textContent='Time up'}},1000)}function resetTimer(){stopTimer();seconds=60;if($('#timerDisplay'))$('#timerDisplay').textContent=clock(seconds);if($('#timerButton'))$('#timerButton').textContent='Start'}home();
</script></body></html>
