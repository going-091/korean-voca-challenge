:9px}.tile .emoji{font-size:28px}.tile p{margin:0 0 9px;color:var(--muted)}.btn{border:0;background:var(--teal);color:#fff;padding:11px 20px;border-radius:9px;font-weight:700}.btn:hover{filter:brightness(.94)}.btn.secondary{background:#fff;color:var(--navy);border:1px solid #cbd9e1}.btn.dark{background:var(--navy)}.btn.warn{background:#c77644}.small{font-size:14px;padding:7px 12px}.sectionhead{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px}.select{border:1px solid #cddce5;border-radius:9px;background:#fff;color:var(--ink);padding:10px 12px;max-width:100%}.pill{font-size:12px;color:var(--teal);border:1px solid #b8ded9;background:#edf8f5;border-radius:30px;padding:4px 11px;font-weight:700}.muted{color:var(--muted)}.question{padding:37px 18px;text-align:center;border-radius:13px;background:var(--navy);color:#fff;margin:19px 0}.question .ko{font-size:clamp(28px,5vw,45px);font-weight:750;line-height:1.35;word-break:keep-all}.question .hint{margin-top:8px;color:#d3e0e9}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.answer{border:1px solid var(--line);background:white;border-radius:10px;padding:14px;text-align:left;min-height:65px;color:var(--ink)}.answer:hover{border-color:var(--teal)}.answer.chosen{border:2px solid var(--teal);background:var(--aqua)}.answer.wrong{border:2px solid var(--red);background:#fff2f0}.feedback{padding:13px 16px;background:#eef7f5;border-radius:10px;margin-top:14px}.feedback.bad{background:#fff3f0}.controls{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}.cardlist{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.roundcard{border:1px solid var(--line);background:#fff;text-align:left;padding:17px;border-radius:11px}.roundcard:hover,.roundcard.active{border-color:var(--teal);background:#f1faf8}.roundcard strong,.roundcard span{display:block}.roundcard span{font-size:13px;color:var(--muted);margin-to 00px){.hero{padding:44px 0}.tiles,.answers{grid-template-columns:1fr}.cardlist{grid-template-columns:repeat(2,1fr)}.shell{padding:0 15px}.tile,.panel{padding:18px}.scores{gap:6px}.score{padding:9px 5px}.score strong{font-size:28px}.score .btn{min-width:35px;padding:6px}.topnav{gap:0}.topnav button{padding:7px 5px;font-size:12px}.numgrid{gap:5px}.number{font-size:17px}}

<header class="top"><div class="shell topline"><div class="brand" onclick="home()"><small>WEEK 8 · BEGINNER KOREAN</small>Korean Voca Challenge</div><nav class="topnav"><button onclick="home()">Home</button><button onclick="practice()">Practice</button><button onclick="teacher()">Team Challenge</button></nav></div></header>
<div class="hero"><div class="shell"><h1>Voca King &amp; Queen</h1></div></div>
<main class="shell main"><div id="app"></div></main><footer class="footer"><div class="shell">© 2026 SML · University of Bristol (UoB). All rights reserved.</div></footer>
<script>
'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mc=[
{q:'회사원',hint:'What does this mean?',o:['Company worker','Teacher','Doctor','Police'],a:0},
{q:'대학교',hint:'What does this mean?',o:['House','University','Park','Market'],a:1},
{q:'자다',hint:'What does this mean?',o:['Work','Exercise','Sleep','Study'],a:2},
{q:'국적',hint:'What does this mean?',o:['Job','Speciality','Nationality','Name'],a:2},
{q:'어디에 가요?',hint:'What does this mean?',o:['How are you?','Where are you going?','What are you doing?','Who are you?'],a:1},
{q:'뭐 해요?',hint:'What does this mean?',o:['How are you?','Where are you going?','What are you doing?','Who are you?'],a:2},
{q:'책을 펴세요.',hint:'What did the teacher say?',o:['Close your book','Open your book','Buy a book','Read a book'],a:1},
{q:'잘 들으세요.',hint:'What did the teacher say?',o:['Sleep well','Listen carefully','Speak Korean','Write carefully'],a:1},
{q:'질문하세요.',hint:'What did the teacher say?',o:['Ask a question','Read a question','Answer a question','Buy a question'],a:0},
{q:'대답하세요.',hint:'What did the teacher say?',o:['Ask a question','Answer the question','Listen carefully','Go home'],a:1}
];
const words=[['Civil servant','공무원'],['Police officer','경찰관'],['Company worker','회사원'],['Chef','요리사'],['Library','도서관'],['Park','공원'],['Restaurant','식당'],['Shop','가게'],['Vegetable','채소'],['Grapes','포도'],['Pear','배'],['Apple','사과'],['To rest','쉬다'],['To drink','마시다'],['To eat','먹다'],['To come','오다'],['Korean person','한국 사람'],['American person','미국 사람'],['Australian person','호주 사람'],['Brazilian person','브라질 사람'],['Thank you.','감사합니다.'],['Hello','안녕하세요.'],['Sorry','죄송합니다.'],["That’s okay.",'괜찮아요.'],['To like','좋아하다'],['To study','공부하다'],['To work','일하다'],['To cook','요리하다'],['To buy','사다']];
const translations=[
['저는 대학생이에요. 지금 도서관에 가요.','I am a university student. I am going to the library now.'],
['저는 프랑스 사람이에요.','I am French.'],
['유키 씨는 전화해요. 유키 씨는 소주를 마셔요.','Yuki makes a phone call. Yuki drinks soju.'],
['유키 씨는 집에 없어요. 유키 씨는 밖에 있어요.','Yuki is not at home. Yuki is outside.'],
['저는 우유를 사요. 우유가 2580원이에요.','I buy milk. The milk costs 2,580 won.']];
const actions=['공부하다','운동하다','자다','전화하다','이야기하다','읽다','쓰다','사다','주다','쉬다','가다','회의하다'];
const locs=['위','아래','앞','뒤','옆','안','밖'];
const polite=[['읽다','읽으세요'],['쓰다','쓰세요'],['운동하다','운동하세요'],['전화하다','전화하세요'],['이야기하다','이야기하세요'],['일하다','일하세요'],['자다','주무세요 (honorific) / 자세요 (simple practice form; less natural)']];
const commands=['책을 펴세요!','읽으세요!','쓰세요!','잘 들으세요!','따라 하세요!','물을 마시세요.','빵을 먹으세요.','옷을 입으세요.','집에 오세요.','교실에 가세요.','한국어를 공부하세요!','운동하세요!','전화하세요!','TV를 보세요.','음악을 들으세요.'];
const sentences=[{words:['저는','학생이에요.'],answer:['저는','학생이에요.'],full:'저는 학생이에요.'},{words:['선생님은','한국 사람이에요.'],answer:['선생님은','한국 사람이에요.'],full:'선생님은 한국 사람이에요.'},{words:['저는','학교에','가요.'],answer:['저는','학교에','가요.'],full:'저는 학교에 가요.'},{words:['집에','있어요.'],answer:['집에','있어요.'],full:'집에 있어요.'}];
const speaking=['이름이 뭐예요?','어느 나라 사람이에요?','학생이에요?','어디에 가요?','무엇을 해요?'];
const tie=[['“Good-bye” when you are leaving?','안녕히 계세요'],['“Good-bye” when the other person is leaving?','안녕히 가세요'],['“Civil servant” in Korean?','공무원'],['“Market” in Korean?','시장'],['What does “괜찮습니다” mean?',"That's okay."]];
const lucky=[['Translate into Korean: water','물'],['Translate into Korean: university','대학교'],['Translate into Korean: to sleep','자다'],['Translate into Korean: market','시장'],['Say “Where are you going?” in Korean','어디에 가요?'],['Bonus: Count from 1 to 10 using Sino-Korean numbers','일, 이, 삼, 사, 오, 육, 칠, 팔, 구, 십'],['Say “Thank you” in Korean','감사합니다'],['Translate into Korean: apple','사과'],['Bonus: Say 20, 30, 40 ... 100 in Sino-Korean','이십, 삼십, 사십, 오십, 육십, 칠십, 팔십, 구십, 백'],['Say “Please listen carefully” in Korean','잘 들으세요']];
const rounds=[['Fastest Finger','6 multiple-choice questions'],['Team Translation','Korean ↔ English'],['Mystery Actions','Act and guess in Korean'],['Where Is It?','Location words and sentences'],['Lucky Number','Choose 1–10'],['Sentence Builder','Make a Korean sentence'],['Ultimate Challenge','Answer in complete sentences'],['Teacher Says!','Act only when the teacher says'],['Polite Requests','Change verbs to -(으)세요'],['Bonus & Tie-breakers','Final speaking and extra questions']];
let mode='home', practiceType='mc',pi=0,selected=null,showAnswer=false,correct=0,attempt=0,wordsChosen=[],teamRound=0,ti=0,teamAnswer=false,teams=['Team A','Team B','Team C'],scores=[0,0,0],usedLucky=[],seconds=60,timerId=null;
function render(html){$('#app').innerHTML=html;window.scrollTo({top:0,behavior:'instant'});}function stopTimer(){if(timerId){clearInterval(timerId);timerId=null;}};
function home(){mode='home';stopTimer();render(`<div class="sectionhead"><h2>Choose your mode</h2></div><div class="tiles"><section class="tile"><div class="emoji">📖</div><h3>Individual Practice</h3><button class="btn" onclick="practice()">Start practising →</button></section><section class="tile"><div class="emoji">🏆</div><h3>Team Challenge</h3><button class="btn dark" onclick="teacher()">Start team challenge →</button></section></div>`)}
function practice(type){stopTimer();mode='practice';if(type)practiceType=type;pi=0;selected=null;showAnswer=false;correct=0;attempt=0;wordsChosen=[];renderPractice();}
function pItems(){return practiceType==='mc'?mc:practiceType==='words'?words:practiceType==='translations'?translations:practiceType==='polite'?polite:sentences;}
function renderPractice(){const items=pItems(),n=items.length,item=items[pi],labels=[['mc','Multiple choice'],['words','Vocabulary cards'],['translations','Translate sentences'],['polite','Polite requests'],['sentences','Sentence builder']];let content='';
if(practiceType==='mc'){content=`<div class="question"><div class="ko">${esc(item.q)}</div><div class="hint">${esc(item.hint)}</div></div><div class="answers">${item.o.map((o,i)=>`<button class="answer ${selected===i?(i===item.a?'chosen':'wrong'):''}" onclick="choose(${i})" ${selected!==null?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div>${selected!==null?`<div class="feedback ${selected===item.a?'':'bad'}"><strong>${selected===item.a?'Correct! +1 point':'Not quite. Review the answer and try the next question.'}</strong><div>Answer: ${esc(item.o[item.a])}</div></div>`:''}`}
if(['words','translations','polite'].includes(practiceType)){let first=item[0],last=item[1];content=`<div class="question"><div class="ko">${esc(first)}</div><div class="hint">${practiceType==='words'?'Say it in Korean before revealing.':practiceType==='polite'?'Change to -(으)세요':'Translate into English before revealing.'}</div></div><div class="controls"><button class="btn" onclick="revealPractice()">${showAnswer?'Answer revealed':'Reveal answer'}</button><span class="stat">Say your answer aloud first</span></div>${showAnswer?`<div class="reveal"><div class="ko">${esc(last)}</div></div>`:''}`}
if(practiceType==='sentences'){const order=item.words.map((_,i)=>i).reverse();content=`<div class="question"><div class="ko">Build a sentence</div><div class="hint">Tap the words in the correct order</div></div><div class="sentencewords">${order.map(i=>`<button class="word" onclick="addWord(${i})" ${wordsChosen.includes(i)?'disabled':''}>${esc(item.words[i])}</button>`).join('')}</div><div class="assembled">${wordsChosen.map(i=>`<span class="word picked">${esc(item.words[i])}</span>`).join('')||'<span class="muted">Your sentence appears here...</span>'}</div><div class="controls"><button class="btn secondary small" onclick="wordsChosen=[];renderPractice()">Clear</button><button class="btn small" onclick="revealPractice()">Check sentence</button></div>${showAnswer?`<div class="feedback ${wordsChosen.join(',')===item.words.map((_,i)=>i).join(',')?'':'bad'}"><strong>${wordsChosen.join(',')===item.words.map((_,i)=>i).join(',')?'Correct!':'Model sentence:'}</strong> ${esc(item.full)}</div>`:''}`}
render(`<div class="sectionhead"><div><h2>Individual Practice</h2></div><button class="btn secondary small" onclick="home()">← Home</button></div><div class="panel"><div class="sectionhead"><label><span class="muted">Activity</span><br><select class="select" onchange="practice(this.value)">${labels.map(([v,l])=>`<option value="${v}" ${practiceType===v?'selected':''}>${esc(l)}</option>`).join('')}</select></label><div class="pill">${pi+1} of ${n}</div></div>${content}<div class="controls"><button class="btn secondary" onclick="previousPractice()" ${pi===0?'disabled':''}>← Previous</button><span class="stat">${practiceType==='mc'?`${correct} correct · ${attempt} answered`:'Self-paced practice'}</span><button class="btn dark" onclick="nextPractice()">${pi===n-1?'Start again ↻':'Next →'}</button></div></div>`)}
function choose(i){if(selected!==null)return;selected=i;attempt++;if(i===mc[pi].a)correct++;renderPractice();}function revealPractice(){showAnswer=true;renderPractice();}function addWord(i){if(!wordsChosen.includes(i))wordsChosen.push(i);showAnswer=false;renderPractice();}function nextPractice(){pi=(pi+1)%pItems().length;selected=null;showAnswer=false;wordsChosen=[];if(pi===0){correct=0;attempt=0;}renderPractice();}function previousPractice(){pi=Math.max(0,pi-1);selected=null;showAnswer=false;wordsChosen=[];renderPractice();}
function teacher(){mode='teacher';stopTimer();teamRound=0;ti=0;teamAnswer=false;renderTeacher();}
function tItems(){switch(teamRound){case 0:return mc.slice(0,6).map(q=>({q:q.q,sub:q.hint,answer:q.o[q.a],options:q.o}));case 1:return [...translations.map(([q,answer])=>({q,sub:'Translate into English',answer})),...words.map(([q,answer])=>({q,sub:'Say it in Korean',answer}))];case 2:return actions.map(q=>({q,sub:'Show this only to the acting student. Team guesses the verb and makes a sentence.',answer:'Example: '+(q==='자다'?'치엔 씨는 자요.':'Make a complete Korean sentence using '+q+' (+1 bonus).')}));case 3:return locs.map(q=>({q,sub:'Make a complete sentence: 펜이 어디에 있어요?',answer:'Example: '+({'위':'책상 위에 있어요.','아래':'의자 아래에 있어요.','앞':'책상 앞에 있어요.','뒤':'의자 뒤에 있어요.','옆':'가방 옆에 있어요.','안':'가방 안에 있어요.','밖':'가방 밖에 있어요.'}[q])}));case 4:return lucky.map(([q,answer])=>({q,sub:'Lucky Number',answer}));case 5:return sentences.map(s=>({q:s.words.slice().reverse().join(' / '),sub:'Put the words in the correct order.',answer:s.full}));case 6:return speaking.map(q=>({q,sub:'Answer in a full Korean sentence.',answer:'Open-ended: teacher checks the sentence and awards up to 5 points.'}));case 7:return commands.map(q=>({q,sub:'Act only if the teacher first says “선생님이 말해요!”',answer:'Teacher checks the action. Deduct a point for acting without the cue.'}));case 8:return polite.map(([q,answer])=>({q,sub:'Change this verb into a polite request.',answer}));default:return [...tie.map(([q,answer])=>({q,sub:'Tie-breaker',answer})),{q:'Final Speaking Challenge',sub:'One minute per team: use at least three polite requests.',answer:'Examples: 책을 펴세요. 잘 들으세요. 질문하세요. 대답하세요. · 5 points if all sentences are correct.'}];}}
function renderTeacher(){const title=rounds[teamRound],items=tItems(),item=items[ti]||items[0];const isLucky=teamRound===4;
render(`<div class="sectionhead"><div><h2>Team Challenge</h2></div><button class="btn secondary small" onclick="home()">← Home</button></div><div class="panel"><div class="sectionhead"><h3>Team scoreboard</h3><button class="btn secondary small" onclick="resetScores()">Reset scores</button></div><div class="scores">${teams.map((n,i)=>`<div class="score"><input aria-label="Team ${i+1} name" value="${esc(n)}" oninput="teams[${i}]=this.value" maxlength="25"><strong>${scores[i]}</strong><div class="scorebuttons"><button class="btn small secondary" onclick="changeScore(${i},-1)">−1</button><button class="btn small" onclick="changeScore(${i},1)">+1</button><button class="btn small dark" onclick="changeScore(${i},3)">+3</button></div></div>`).join('')}</div><div class="divider"></div><h3>Choose a round</h3><div class="cardlist">${rounds.map(([name,desc],i)=>`<button class="roundcard ${teamRound===i?'active':''}" onclick="chooseRound(${i})"><strong>${i+1}. ${esc(name)}</strong><span>${esc(desc)}</span></button>`).join('')}</div><div class="divider"></div><div class="sectionhead"><div><span class="pill">Round ${teamRound+1}</span> <span class="muted">${esc(title[0])} · ${isLucky?usedLucky.length+' of 10 numbers chosen':(ti+1)+' of '+items.length}</span></div><div class="controls" style="margin:0"><span class="timer" id="timerDisplay">${clock(seconds)}</span><button class="btn small secondary" onclick="toggleTimer()" id="timerButton">Start timer</button><button class="btn small secondary" onclick="resetTimer()">Reset</button></div></div>${isLucky?`<p class="muted">Choose an unopened number to reveal its question.</p><div class="numgrid">${lucky.map((_,i)=>`<button class="number ${usedLucky.includes(i)?'used':''}" ${usedLucky.includes(i)?'disabled':''} onclick="chooseLucky(${i})">${i+1}</button>`).join('')}</div>`:''}<div class="question teacherprompt"><div class="ko">${isLucky&&usedLucky.length===0?"Choose a lucky number!":esc(item.q)}</div><div class="hint">${isLucky&&usedLucky.length===0?"Pick a number from 1 to 10 above.":esc(item.sub)}</div>${item.options&&(!isLucky||usedLucky.length)?`<div class="hint" style="margin-top:12px">${item.options.map((o,i)=>String.fromCharCode(65+i)+'. '+o).join('   ·   ')}</div>`:''}</div><div class="controls"><button class="btn secondary" onclick="prevTeacher()" ${isLucky||ti===0?'disabled':''}>← Previous</button><button class="btn" onclick="revealTeacher()" ${isLucky&&usedLucky.length===0?'disabled':''}>${teamAnswer?'Hide answer':'Reveal answer'}</button><button class="btn dark" onclick="nextTeacher()" ${isLucky?'disabled':''}>Next →</button></div>${teamAnswer?`<div class="reveal"><strong>Answer / teacher guidance</strong><div class="ko">${esc(item.answer)}</div></div>`:''}</div>`)}
function chooseRound(i){stopTimer();teamRound=i;ti=0;teamAnswer=false;seconds=60;renderTeacher();}function changeScore(i,delta){scores[i]=Math.max(0,scores[i]+delta);renderTeacherKeepTimer();}function renderTeacherKeepTimer(){const running=!!timerId;stopTimer();renderTeacher();if(running)toggleTimer();}function resetScores(){if(confirm('Reset all team scores to zero?')){scores=[0,0,0];renderTeacherKeepTimer();}}
function revealTeacher(){teamAnswer=!teamAnswer;renderTeacherKeepTimer();}function nextTeacher(){ti=(ti+1)%tItems().length;teamAnswer=false;renderTeacherKeepTimer();}function prevTeacher(){ti=Math.max(0,ti-1);teamAnswer=false;renderTeacherKeepTimer();}function chooseLucky(i){if(usedLucky.includes(i))return;usedLucky.push(i);ti=i;teamAnswer=false;renderTeacherKeepTimer();}
function clock(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function toggleTimer(){if(timerId){stopTimer();$('#timerButton').textContent='Start timer';return;}if(seconds===0)seconds=60;$('#timerButton').textContent='Pause timer';timerId=setInterval(()=>{seconds=Math.max(0,seconds-1);const el=$('#timerDisplay');if(el)el.textContent=clock(seconds);if(seconds===0){stopTimer();const b=$('#timerButton');if(b)b.textContent='Time up';}},1000)}function resetTimer(){stopTimer();seconds=60;$('#timerDisplay').textContent=clock(seconds);$('#timerButton').textContent='Start timer'}
home();
</script>
</body>
</html>
